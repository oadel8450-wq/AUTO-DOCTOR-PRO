
name: AUTO DOCTOR PRO APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AUTO DOCTOR PRO
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_ACCEPT_SDK_LICENSE: "1"

    steps:
      # 1. Download project
      - name: Checkout Project
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. Install Linux Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            cmake \
            gettext \
            ccache

      # 5. Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      # 6. Install Android SDK Packages
      - name: Install Android SDK Packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

      # 7. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.33" \
            buildozer

      # 8. Verify Project Files
      - name: Check Project Files
        run: |
          test -f main.py
          test -f buildozer.spec

          echo "PROJECT FILES VERIFIED"

          grep -nE \
            '^(title|package.name|package.domain|requirements|android.api|android.ndk|android.archs|android.accept_sdk_license)[[:space:]]*=' \
            buildozer.spec || true

      # 9. Build APK
      - name: Build AUTO DOCTOR PRO APK
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          yes | buildozer -v android debug

      # 10. Verify APK
      - name: Verify APK
        run: |
          ls -lh bin/*.apk

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      # 11. Upload APK
      - name: Upload AUTO DOCTOR PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-DOCTOR-PRO-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
