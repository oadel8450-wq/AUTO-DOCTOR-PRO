name: AUTO DOCTOR PRO APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: 25.2.9519653

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            build-essential \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK and NDK Paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Pre-Install Android NDK 25
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"

          test -f "$ANDROID_NDK_ROOT/source.properties"

          cat "$ANDROID_NDK_ROOT/source.properties"

          echo "NDK 25 INSTALLED SUCCESSFULLY"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.33

      - name: Verify Build Environment
        run: |
          python --version
          java -version
          buildozer --version

          echo "ANDROID SDK:"
          ls "$ANDROID_SDK_ROOT"

          echo "ANDROID BUILD TOOLS:"
          ls "$ANDROID_SDK_ROOT/build-tools/33.0.2"

          echo "ANDROID NDK:"
          ls "$ANDROID_NDK_ROOT"

      - name: Preinstall and Link NDK 25 for Buildozer
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-ndk-r25b"

          ln -s "$ANDROID_NDK_ROOT" \
          "$HOME/.buildozer/android/platform/android-ndk-r25b"

          echo "BUILDOZER NDK LINK CREATED"

          ls -la "$HOME/.buildozer/android/platform/"

          test -f "$HOME/.buildozer/android/platform/android-ndk-r25b/source.properties"

          echo "NDK READY FOR BUILDOZER"

      - name: Build AUTO DOCTOR PRO APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AUTO-DOCTOR-PRO-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14



 
