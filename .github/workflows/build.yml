name: AUTO DOCTOR PRO APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AUTO DOCTOR PRO
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5 \
            libncursesw5 \
            libtinfo6 \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.33
          pip install buildozer

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK Manager
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Checking SDK Manager..."

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in Android Setup directory!"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "SDK Manager found successfully."
          "$SDKMANAGER" --version

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses

      - name: Install Android SDK Packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build AUTO DOCTOR PRO APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-DOCTOR-PRO-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
