
      name: AUTO DOCTOR PRO APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_ACCEPT_SDK_LICENSE: "1"
      ANDROID_API: 33
      ANDROID_MIN_API: 23

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            build-essential

      - name: Configure Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"

          SDKMANAGER=$(command -v sdkmanager)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          CMDLINE_DIR=$(dirname "$(dirname "$SDKMANAGER")")

          echo "Command Line Tools: $CMDLINE_DIR"

          mkdir -p "$ANDROID_SDK_ROOT/tools"

          cp -a "$CMDLINE_DIR/." \
            "$ANDROID_SDK_ROOT/tools/"

          test -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install Cython==0.29.33

      - name: Verify Android Configuration
        run: |
          echo "Checking Android SDK..."

          test -d "$ANDROID_SDK_ROOT/platforms/android-33"
          test -d "$ANDROID_SDK_ROOT/build-tools/33.0.2"
          test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          test -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          java -version
          python --version
          buildozer --version
          cython --version

      - name: Build AUTO DOCTOR PRO APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AUTO-DOCTOR-PRO-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

