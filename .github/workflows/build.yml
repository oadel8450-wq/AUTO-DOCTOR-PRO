name: AUTO DOCTOR PRO APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Verify Android NDK
        run: |
          test -f "$ANDROID_SDK_ROOT/ndk/25.2.9519653/source.properties"
          cat "$ANDROID_SDK_ROOT/ndk/25.2.9519653/source.properties"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.33

      - name: Verify Build Environment
        run: |
          python --version
          java -version
          buildozer --version
          echo "NDK VERSION:"
          ls "$ANDROID_NDK_HOME"

      - name: Build AUTO DOCTOR PRO APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AUTO-DOCTOR-PRO-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
